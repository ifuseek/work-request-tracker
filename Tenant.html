<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles') ?>
</head>
<body>
  <header>
    <h1><?= property ?> · Work Requests</h1>
    <p>Submit and track repair and maintenance requests. Every update is time-stamped.</p>
  </header>
  <main>
    <!-- List view -->
    <section id="listView">
      <div class="row" style="margin-bottom:12px">
        <div class="tabs">
          <button id="tabOpen" onclick="setFilter('open')">Open</button>
          <button id="tabClosed" class="secondary" onclick="setFilter('closed')">Closed</button>
        </div>
        <button onclick="showForm()">+ New request</button>
      </div>
      <div id="list"><p class="muted">Loading…</p></div>
    </section>

    <!-- New request form -->
    <section id="formView" class="hidden">
      <div class="card">
        <h2 style="margin-top:0;font-size:18px">New work request</h2>
        <label for="title">What needs attention?</label>
        <input type="text" id="title" maxlength="120" placeholder="e.g., Garage gutter has come apart">
        <label for="category">Category</label>
        <select id="category"></select>
        <label>Priority</label>
        <div id="priorities"></div>
        <label for="location">Location</label>
        <input type="text" id="location" maxlength="200" placeholder="e.g., Garage, northeast corner">
        <label for="description">Description</label>
        <textarea id="description" maxlength="4000" placeholder="What is happening, since when, and any safety concerns."></textarea>
        <label for="access">Access and scheduling notes</label>
        <textarea id="access" maxlength="1000" style="min-height:64px"
          placeholder="e.g., Please propose times here; exterior work needs no entry."></textarea>
        <div class="help">Interior visits are coordinated in the tracker with at least 24 hours' notice.</div>
        <label for="photos">Photos (up to 5)</label>
        <input type="file" id="photos" accept="image/*" multiple>
        <div class="actions">
          <button id="submitBtn" onclick="submitRequest()">Submit request</button>
          <button class="secondary" onclick="showList()">Cancel</button>
        </div>
        <div id="formError" class="error"></div>
      </div>
    </section>

    <!-- Detail view -->
    <section id="detailView" class="hidden">
      <p><a href="#" onclick="showList();return false;">← All requests</a></p>
      <div id="detail"></div>
    </section>
  </main>

  <?!= include('Shared') ?>
  <script>
    var KEY = <?!= JSON.stringify(key).replace(/</g, '\\u003c') ?>;
    var CATEGORIES = <?!= JSON.stringify(categories).replace(/</g, '\\u003c') ?>;
    var PRIORITIES = <?!= JSON.stringify(priorities).replace(/</g, '\\u003c') ?>;
    var RESPONSE = <?!= JSON.stringify(responseTimes).replace(/</g, '\\u003c') ?>;
    var requests = [];
    var filter = 'open';

    function init() {
      var cat = document.getElementById('category');
      CATEGORIES.forEach(function (c) { cat.appendChild(el('option', { value: c, text: c })); });
      var pr = document.getElementById('priorities');
      PRIORITIES.forEach(function (p, i) {
        var time = i === 0 ? RESPONSE.urgent : (p === 'Routine' ? RESPONSE.routine : RESPONSE.standard);
        var id = 'pri' + i;
        var input = el('input', { type: 'radio', name: 'priority', id: id, value: p });
        if (p === 'Standard') input.checked = true;
        pr.appendChild(el('div', { style: 'margin:4px 0' }, [input, ' ',
          el('label', { for: id, style: 'display:inline;font-weight:400', text: p + ' · response ' + time })]));
      });
      load();
    }

    function load() {
      call('tenantList', [KEY]).then(function (r) { requests = r; renderList(); })
        .catch(function (e) { document.getElementById('list').textContent = e; });
    }

    function setFilter(f) {
      filter = f;
      document.getElementById('tabOpen').className = f === 'open' ? '' : 'secondary';
      document.getElementById('tabClosed').className = f === 'closed' ? '' : 'secondary';
      renderList();
    }

    function renderList() {
      var list = document.getElementById('list');
      clear(list);
      var items = requests.filter(function (r) { return filter === 'open' ? r.open : !r.open; });
      if (!items.length) {
        list.appendChild(el('p', { class: 'muted', text: filter === 'open' ? 'No open requests.' : 'No closed requests.' }));
        return;
      }
      items.forEach(function (r) {
        list.appendChild(el('div', { class: 'card list-item', onclick: function () { openDetail(r.id); } }, [
          el('div', { class: 'row' }, [
            el('strong', { text: r.id + ' · ' + r.title }),
            el('span', { class: statusClass(r.status), text: r.status })
          ]),
          el('div', { class: 'muted', text: r.category + ' · ' + r.priority.split(' (')[0] +
            (r.scheduledFor && r.status === 'Scheduled' ? ' · Scheduled ' + r.scheduledFor : '') +
            ' · Updated ' + r.updated })
        ]));
      });
    }

    function show(view) {
      ['listView', 'formView', 'detailView'].forEach(function (v) {
        document.getElementById(v).classList.toggle('hidden', v !== view);
      });
      window.scrollTo(0, 0);
    }
    function showList() { show('listView'); load(); }
    function showForm() {
      ['title', 'location', 'description', 'access', 'photos'].forEach(function (id) { document.getElementById(id).value = ''; });
      document.getElementById('formError').textContent = '';
      show('formView');
    }

    function resizeImage(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var max = 1600, w = img.width, h = img.height;
            if (w > max || h > max) { var s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
            var c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mimeType: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] });
          };
          img.onerror = function () { reject('Could not read ' + file.name); };
          img.src = reader.result;
        };
        reader.onerror = function () { reject('Could not read ' + file.name); };
        reader.readAsDataURL(file);
      });
    }

    function submitRequest() {
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('formError');
      err.textContent = '';
      var pri = document.querySelector('input[name=priority]:checked');
      var files = Array.prototype.slice.call(document.getElementById('photos').files || [], 0, 5);
      busy(btn, true); btn.textContent = 'Submitting…';
      Promise.all(files.map(resizeImage)).then(function (photos) {
        return call('tenantCreate', [KEY, {
          title: document.getElementById('title').value,
          category: document.getElementById('category').value,
          priority: pri ? pri.value : 'Standard',
          location: document.getElementById('location').value,
          description: document.getElementById('description').value,
          access: document.getElementById('access').value,
          photos: photos
        }]);
      }).then(function (r) {
        openDetail(r.id);
      }).catch(function (e) {
        err.textContent = e;
      }).then(function () { busy(btn, false); btn.textContent = 'Submit request'; });
    }

    function openDetail(id) {
      show('detailView');
      var d = document.getElementById('detail');
      clear(d); d.appendChild(el('p', { class: 'muted', text: 'Loading…' }));
      call('tenantDetail', [KEY, id]).then(renderDetail).catch(function (e) { d.textContent = e; });
    }

    function renderDetail(r) {
      var d = document.getElementById('detail');
      clear(d);
      var noteBox = el('textarea', { id: 'note', placeholder: 'Add a message (optional for some actions)' });
      var errBox = el('div', { class: 'error' });
      function act(action, needsNote) {
        return function (ev) {
          if (needsNote && !noteBox.value.trim()) { errBox.textContent = 'Please add a message first.'; return; }
          busy(ev.target, true);
          call('tenantAction', [KEY, r.id, action, noteBox.value]).then(renderDetail)
            .catch(function (e) { errBox.textContent = e; busy(ev.target, false); });
        };
      }
      var actions = [el('button', { onclick: act('comment', true), text: 'Send message' })];
      if (r.status === 'Scheduled') actions.push(el('button', { class: 'secondary', onclick: act('confirm'), text: 'Confirm scheduled time' }));
      if (r.status === 'Completed') actions.push(el('button', { class: 'secondary', onclick: act('reopen', true), text: 'Reopen (not resolved)' }));
      if (r.open) actions.push(el('button', { class: 'danger', onclick: act('withdraw'), text: 'Withdraw request' }));

      d.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'row' }, [
          el('h2', { style: 'margin:0;font-size:18px', text: r.id + ' · ' + r.title }),
          el('span', { class: statusClass(r.status), text: r.status })
        ]),
        el('div', { class: 'muted', text: 'Submitted ' + r.created + ' · Updated ' + r.updated }),
        r.scheduledFor ? el('div', { class: 'notice', style: 'margin-top:10px', text: 'Scheduled: ' + r.scheduledFor }) : null,
        field('Category', r.category), field('Priority', r.priority + ' · requested response ' + r.responseTime),
        field('Location', r.location), field('Description', r.description, true),
        field('Access and scheduling notes', r.access, true), photosBlock(r.photos)
      ]));
      d.appendChild(el('div', { class: 'card' }, [el('h3', { style: 'margin-top:0;font-size:16px', text: 'History' }), timeline(r.log)]));
      d.appendChild(el('div', { class: 'card' }, [
        el('h3', { style: 'margin-top:0;font-size:16px', text: 'Respond' }),
        noteBox, el('div', { class: 'actions' }, actions), errBox
      ]));
    }

    init();
  </script>
</body>
</html>
