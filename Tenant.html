<!DOCTYPE html>
<!-- Work Request Tracker v1.7.1 -->
<html>
<head>
  <base target="_top">
  <?!= include('Styles') ?>
</head>
<body>
  <header>
    <h1><?= property ?> · Work Requests</h1>
    <p>Submit and track repair and maintenance requests. Every update is time-stamped.</p>
  </header>
  <main>
    <!-- List view -->
    <section id="listView">
      <div class="row" style="margin-bottom:12px">
        <div class="tabs">
          <button id="tabOpen" onclick="setFilter('open')">Summary</button>
          <button id="tabAll" class="secondary" onclick="setFilter('all')">All requests</button>
        </div>
        <button onclick="showForm()">+ New request</button>
      </div>
      <div id="list"><p class="muted">Loading…</p></div>
    </section>

    <!-- New request form -->
    <section id="formView" class="hidden">
      <div class="card">
        <h2 style="margin-top:0;font-size:18px">New work request</h2>
        <label for="title">What needs attention?</label>
        <input type="text" id="title" maxlength="120" placeholder="e.g., Garage gutter has come apart">
        <label>Where</label>
        <div class="choices">
          <? for (var b = 0; b < buildings.length; b++) { ?>
            <label class="choice"><input type="radio" name="building" value="<?= buildings[b] ?>"
              <?= b === 0 ? 'checked' : '' ?>> <?= buildings[b] ?></label>
          <? } ?>
        </div>
        <div class="choices" style="margin-top:8px">
          <? for (var a = 0; a < areas.length; a++) { ?>
            <label class="choice"><input type="radio" name="area" value="<?= areas[a] ?>"
              <?= a === 0 ? 'checked' : '' ?>> <?= areas[a] ?></label>
          <? } ?>
        </div>
        <div class="help">Interior work needs a visit time agreed at least 24 hours ahead. Exterior work usually needs no entry.</div>
        <label for="category">Category</label>
        <select id="category">
          <? for (var c = 0; c < categories.length; c++) { ?>
            <option value="<?= categories[c] ?>"><?= categories[c] ?></option>
          <? } ?>
        </select>
        <label>Priority</label>
        <div>
          <? for (var p = 0; p < priorities.length; p++) {
               var pr = priorities[p];
               var time = p === 0 ? responseTimes.urgent : (pr === 'Routine' ? responseTimes.routine : responseTimes.standard); ?>
            <label class="choice block"><input type="radio" name="priority" value="<?= pr ?>"
              <?= pr === 'Standard' ? 'checked' : '' ?>> <?= pr ?> · response <?= time ?></label>
          <? } ?>
        </div>
        <label for="location">Specific location</label>
        <input type="text" id="location" maxlength="200" placeholder="e.g., Garage, northeast corner">
        <label for="description">Description</label>
        <textarea id="description" maxlength="4000" placeholder="What is happening, since when, and any safety concerns."></textarea>
        <label for="access">Access and scheduling notes</label>
        <textarea id="access" maxlength="1000" style="min-height:64px"
          placeholder="e.g., Please propose times here; exterior work needs no entry."></textarea>
        <label for="photos">Photos (up to 5)</label>
        <input type="file" id="photos" accept="image/*" multiple onchange="addPhotos(this)">
        <div id="photoPreview" class="thumbs"></div>
        <div id="photoNote" class="help"></div>
        <div class="actions">
          <button id="submitBtn" onclick="submitRequest()">Submit request</button>
          <button class="secondary" onclick="showList()">Cancel</button>
        </div>
        <div id="formError" class="error"></div>
      </div>
    </section>

    <!-- Detail view -->
    <section id="detailView" class="hidden">
      <p><a href="#" onclick="showList();return false;">← All requests</a></p>
      <div id="detail"></div>
    </section>
  </main>
  <footer style="text-align:center;color:#9aa5b1;font-size:12px;padding:8px 0 24px">Work Request Tracker v<?= version ?></footer>

  <?!= include('Shared') ?>
  <script>
    var KEY = <?!= JSON.stringify(key).replace(/</g, '\\u003c') ?>;
    var requests = [];
    var filter = 'open';

    function init() { load(); }

    function load() {
      call('tenantList', [KEY]).then(function (r) { requests = r; renderList(); })
        .catch(function (e) { document.getElementById('list').textContent = e; });
    }

    function setFilter(f) {
      filter = f;
      document.getElementById('tabOpen').className = f === 'open' ? '' : 'secondary';
      document.getElementById('tabAll').className = f === 'all' ? '' : 'secondary';
      renderList();
    }

    function renderList() {
      var list = document.getElementById('list');
      clear(list);
      if (filter === 'all') {
        if (!requests.length) { list.appendChild(el('p', { class: 'muted', text: 'No requests yet.' })); return; }
        var openAll = requests.filter(function (r) { return r.open; });
        var closed = requests.filter(function (r) { return !r.open; });
        list.appendChild(sectionTitle('Open (' + openAll.length + ')'));
        if (!openAll.length) list.appendChild(el('p', { class: 'muted', text: 'No open requests.' }));
        openAll.forEach(function (r) { list.appendChild(requestRow(r)); });
        list.appendChild(sectionTitle('Closed (' + closed.length + ')'));
        if (!closed.length) list.appendChild(el('p', { class: 'muted', text: 'No closed requests.' }));
        closed.forEach(function (r) { list.appendChild(requestRow(r)); });
        return;
      }
      var open = requests.filter(function (r) { return r.open; });
      var visits = upcomingVisits(requests);
      var attention = visits.filter(function (r) { return !r.tenantConfirmed; });
      var waiting = open.filter(function (r) { return r.status !== 'Scheduled'; });

      list.appendChild(el('div', { class: 'stats' }, [
        stat(open.length, 'Open requests'), stat(visits.length, 'Upcoming visits'),
        stat(attention.length, 'Need your confirmation', attention.length ? 'alert' : '')
      ]));

      if (attention.length) {
        list.appendChild(sectionTitle('Needs your attention'));
        attention.forEach(function (r) {
          list.appendChild(el('div', { class: 'card attention list-item', onclick: function () { openDetail(r.id); } }, [
            el('strong', { text: 'Please confirm: ' + r.title }),
            el('div', { text: r.scheduledFor }),
            el('div', { class: 'muted', text: 'Open to confirm this time or request a change.' })
          ]));
        });
      }

      list.appendChild(sectionTitle('Upcoming visits'));
      if (!visits.length) list.appendChild(el('p', { class: 'muted', text: 'No visits scheduled.' }));
      visits.forEach(function (r) { list.appendChild(visitRow(r, function () { openDetail(r.id); }, 'Awaiting your confirmation')); });

      list.appendChild(sectionTitle('Calendar'));
      list.appendChild(visitCalendar(requests, function (r) { openDetail(r.id); }));

      list.appendChild(sectionTitle('Waiting on scheduling or a response'));
      if (!waiting.length) list.appendChild(el('p', { class: 'muted', text: 'Nothing waiting.' }));
      waiting.forEach(function (r) { list.appendChild(requestRow(r)); });
    }

    function requestRow(r) {
      return el('div', { class: 'card list-item', onclick: function () { openDetail(r.id); } }, [
        el('div', { class: 'row' }, [
          el('strong', { text: r.id + ' · ' + r.title }),
          el('span', { class: statusClass(r.status), text: r.status })
        ]),
        el('div', { class: 'muted', text: where(r) + (r.building ? ' · ' : '') +
          r.category + ' · ' + r.priority.split(' (')[0] + ' · Updated ' + r.updated })
      ]);
    }

    function show(view) {
      ['listView', 'formView', 'detailView'].forEach(function (v) {
        document.getElementById(v).classList.toggle('hidden', v !== view);
      });
      window.scrollTo(0, 0);
    }
    function showList() { show('listView'); load(); }
    var selectedPhotos = [];
    var MAX_PHOTOS = 5;

    // Add newly chosen photos to the selection (up to 5) and show previews.
    function addPhotos(input) {
      var added = Array.prototype.slice.call(input.files || []);
      var room = MAX_PHOTOS - selectedPhotos.length;
      selectedPhotos = selectedPhotos.concat(added.slice(0, Math.max(room, 0)));
      document.getElementById('photoNote').textContent = added.length > room
        ? 'Only ' + MAX_PHOTOS + ' photos can be attached. Extra photos were not added.' : '';
      input.value = '';
      renderPreviews();
    }

    function renderPreviews() {
      var box = document.getElementById('photoPreview');
      clear(box);
      selectedPhotos.forEach(function (file, i) {
        var img = el('img', { alt: file.name });
        var url = URL.createObjectURL(file);
        img.src = url;
        img.onload = function () { URL.revokeObjectURL(url); };
        box.appendChild(el('div', { class: 'thumb' }, [img,
          el('button', { type: 'button', class: 'thumb-remove', title: 'Remove photo', 'aria-label': 'Remove photo ' + (i + 1),
            onclick: function () { selectedPhotos.splice(i, 1); document.getElementById('photoNote').textContent = ''; renderPreviews(); },
            text: '×' })]));
      });
      document.getElementById('photos').disabled = selectedPhotos.length >= MAX_PHOTOS;
    }

    function showForm() {
      ['title', 'location', 'description', 'access', 'photos'].forEach(function (id) { document.getElementById(id).value = ''; });
      selectedPhotos = [];
      document.getElementById('photoNote').textContent = '';
      renderPreviews();
      document.getElementById('formError').textContent = '';
      show('formView');
    }

    function resizeImage(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var max = 1600, w = img.width, h = img.height;
            if (w > max || h > max) { var s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
            var c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mimeType: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] });
          };
          img.onerror = function () { reject('Could not read ' + file.name); };
          img.src = reader.result;
        };
        reader.onerror = function () { reject('Could not read ' + file.name); };
        reader.readAsDataURL(file);
      });
    }

    function submitRequest() {
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('formError');
      err.textContent = '';
      var pri = document.querySelector('input[name=priority]:checked');
      var files = selectedPhotos.slice(0, MAX_PHOTOS);
      busy(btn, true); btn.textContent = 'Submitting…';
      Promise.all(files.map(resizeImage)).then(function (photos) {
        return call('tenantCreate', [KEY, {
          title: document.getElementById('title').value,
          category: document.getElementById('category').value,
          priority: pri ? pri.value : 'Standard',
          building: (document.querySelector('input[name=building]:checked') || {}).value || '',
          area: (document.querySelector('input[name=area]:checked') || {}).value || '',
          location: document.getElementById('location').value,
          description: document.getElementById('description').value,
          access: document.getElementById('access').value,
          photos: photos
        }]);
      }).then(function (r) {
        openDetail(r.id);
      }).catch(function (e) {
        err.textContent = e;
      }).then(function () { busy(btn, false); btn.textContent = 'Submit request'; });
    }

    function openDetail(id) {
      show('detailView');
      var d = document.getElementById('detail');
      clear(d); d.appendChild(el('p', { class: 'muted', text: 'Loading…' }));
      call('tenantDetail', [KEY, id]).then(renderDetail).catch(function (e) { d.textContent = e; });
    }

    // Explains how the comment box applies to the other buttons currently shown.
    function helpLine(r) {
      var parts = [];
      if (r.open) parts.push('withdrawing');
      var text = parts.length ? 'Any comment you write is also included when ' + parts.join(' or ') + '.' : '';
      if (r.status === 'Completed') text = 'To reopen, describe what still needs attention.';
      return text ? el('div', { class: 'help', text: text }) : null;
    }

    function renderDetail(r) {
      var d = document.getElementById('detail');
      clear(d);
      var noteBox = el('textarea', { id: 'note', placeholder: 'Write a follow-up or additional comment' });
      var errBox = el('div', { class: 'error' });
      function act(action, needsNote) {
        return function (ev) {
          if (needsNote && !noteBox.value.trim()) {
            errBox.textContent = action === 'reopen' ? 'Please describe what still needs attention.' : 'Please write your comment first.';
            return;
          }
          busy(ev.target, true);
          call('tenantAction', [KEY, r.id, action, noteBox.value]).then(renderDetail)
            .catch(function (e) { errBox.textContent = e; busy(ev.target, false); });
        };
      }
      var actions = [el('button', { onclick: act('comment', true), text: 'Send follow-up' })];
      if (r.status === 'Completed') actions.push(el('button', { class: 'secondary', onclick: act('reopen', true), text: 'Reopen (not resolved)' }));
      if (r.open) actions.push(el('button', { class: 'danger', onclick: act('withdraw'), text: 'Withdraw request' }));

      d.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'row' }, [
          el('h2', { style: 'margin:0;font-size:18px', text: r.id + ' · ' + r.title }),
          el('span', { class: statusClass(r.status), text: r.status })
        ]),
        el('div', { class: 'muted', text: 'Submitted ' + r.created + ' · Updated ' + r.updated }),
        field('Category', r.category), field('Priority', r.priority + ' · requested response ' + r.responseTime),
        field('Where', [r.building, r.area].filter(Boolean).join(' · ')),
        field('Specific location', r.location), field('Description', r.description, true),
        field('Access and scheduling notes', r.access, true), photosBlock(r.photos)
      ]));
      var visitCard = scheduleCard(r);
      if (visitCard) d.appendChild(visitCard);
      d.appendChild(el('div', { class: 'card' }, [el('h3', { style: 'margin-top:0;font-size:16px', text: 'History' }), timeline(r.log)]));
      d.appendChild(el('div', { class: 'card' }, [
        el('h3', { style: 'margin-top:0;font-size:16px', text: 'Follow-up / Additional comment' }),
        noteBox, el('div', { class: 'actions' }, actions), helpLine(r), errBox
      ]));
    }

    // The latest visit details the landlord entered (who is coming, contact, notes).
    function lastVisitNote(r) {
      for (var i = r.log.length - 1; i >= 0; i--) {
        if (/^(Scheduled|Changed visit to)/.test(r.log[i].action)) return r.log[i].note;
      }
      return '';
    }

    function scheduleCard(r) {
      if (r.status === 'Change requested') {
        return el('div', { class: 'card attention' }, [
          el('h3', { style: 'margin-top:0;font-size:16px', text: 'Change requested' }),
          el('div', { text: 'You asked to change the visit. The landlord will propose a new time here.' })
        ]);
      }
      if (r.status !== 'Scheduled') return null;
      var reason = el('textarea', { placeholder: 'What needs to change? Suggest days and times that work for you.' });
      var errBox = el('div', { class: 'error' });
      var changePanel = el('div', { class: 'hidden' }, [el('label', { text: 'Request a change' }), reason,
        el('div', { class: 'actions' }, [el('button', { class: 'secondary', text: 'Send change request', onclick: function (ev) {
          if (!reason.value.trim()) { errBox.textContent = 'Please say what needs to change and suggest times that work.'; return; }
          busy(ev.target, true);
          call('tenantAction', [KEY, r.id, 'change', reason.value]).then(renderDetail)
            .catch(function (e) { errBox.textContent = e; busy(ev.target, false); });
        } })])]);
      var buttons = [];
      if (!r.tenantConfirmed) buttons.push(el('button', { text: 'Confirm this time', onclick: function (ev) {
        busy(ev.target, true);
        call('tenantAction', [KEY, r.id, 'confirm', '']).then(renderDetail)
          .catch(function (e) { errBox.textContent = e; busy(ev.target, false); });
      } }));
      buttons.push(el('button', { class: 'secondary', text: 'Request a change', onclick: function () {
        changePanel.classList.remove('hidden'); reason.focus();
      } }));
      var note = lastVisitNote(r);
      return el('div', { class: 'card ' + (r.tenantConfirmed ? '' : 'attention') }, [
        el('h3', { style: 'margin-top:0;font-size:16px', text: 'Scheduled visit' }),
        el('div', { class: 'when', text: r.scheduledFor }),
        el('span', { class: 'badge ' + (r.tenantConfirmed ? 'Completed' : 'Submitted'),
          text: r.tenantConfirmed ? 'Confirmed ' + r.tenantConfirmed : 'Awaiting your confirmation' }),
        note ? el('div', { class: 'pre muted', style: 'margin-top:10px', text: note }) : null,
        calLinks(r),
        el('div', { class: 'actions' }, buttons), changePanel, errBox
      ]);
    }

    init();
  </script>
</body>
</html>
