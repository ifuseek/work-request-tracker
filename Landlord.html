<!DOCTYPE html>
<!-- Work Request Tracker v1.5.0 -->
<html>
<head>
  <base target="_top">
  <?!= include('Styles') ?>
</head>
<body>
  <header>
    <h1><?= property ?> · Work Requests</h1>
    <p>Respond to requests here. No account needed. Every update is time-stamped and shared with the tenant.</p>
  </header>
  <main>
    <div id="app"><p class="muted">Loading…</p></div>
  </main>
  <footer style="text-align:center;color:#9aa5b1;font-size:12px;padding:8px 0 24px">Work Request Tracker v<?= version ?></footer>

  <?!= include('Shared') ?>
  <script>
    var MODE = <?!= JSON.stringify(mode).replace(/</g, '\\u003c') ?>;
    var ID = <?!= JSON.stringify(id).replace(/</g, '\\u003c') ?>;
    var TOKEN = <?!= JSON.stringify(token).replace(/</g, '\\u003c') ?>;
    var LKEY = <?!= JSON.stringify(lkey).replace(/</g, '\\u003c') ?>;
    var app = document.getElementById('app');

    function loadRequest() {
      call('landlordDetail', [ID, TOKEN]).then(renderRequest).catch(function (e) { app.textContent = e; });
    }

    function loadList() {
      call('landlordList', [LKEY]).then(renderList).catch(function (e) { app.textContent = e; });
    }

    function renderList(items) {
      clear(app);
      if (!items.length) { app.appendChild(el('p', { class: 'muted', text: 'No requests yet.' })); return; }
      items.forEach(function (r) {
        app.appendChild(el('div', { class: 'card' }, [
          el('div', { class: 'row' }, [
            el('a', { href: r.link, text: r.id + ' · ' + r.title }),
            el('span', { class: statusClass(r.status), text: r.status })
          ]),
          el('div', { class: 'muted', text: [r.building, r.area].filter(Boolean).join(' · ') + (r.building ? ' · ' : '') +
            r.category + ' · ' + r.priority.split(' (')[0] + ' · Updated ' + r.updated })
        ]));
      });
    }

    function renderRequest(r) {
      clear(app);
      app.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'row' }, [
          el('h2', { style: 'margin:0;font-size:18px', text: r.id + ' · ' + r.title }),
          el('span', { class: statusClass(r.status), text: r.status })
        ]),
        el('div', { class: 'muted', text: 'Submitted ' + r.created + ' · Updated ' + r.updated }),
        r.scheduledFor ? el('div', { class: 'notice', style: 'margin-top:10px', text: 'Scheduled: ' + r.scheduledFor }) : null,
        field('Category', r.category), field('Priority', r.priority + ' · requested response ' + r.responseTime),
        field('Where', [r.building, r.area].filter(Boolean).join(' · ')),
        field('Specific location', r.location), field('Description', r.description, true),
        field('Access and scheduling notes', r.access, true), photosBlock(r.photos)
      ]));
      app.appendChild(el('div', { class: 'card' }, [el('h3', { style: 'margin-top:0;font-size:16px', text: 'History' }), timeline(r.log)]));

      if (!r.open) {
        app.appendChild(el('div', { class: 'card notice', text: 'This request is ' + r.status.toLowerCase() + '. No further action is needed.' }));
        return;
      }

      var note = el('textarea', { placeholder: 'Message to the tenant' });
      var err = el('div', { class: 'error' });
      var sched = scheduler(r);
      var visit = visitorForm(r);
      var schedErr = el('div', { class: 'error' });
      function act(action, opts) {
        return function (ev) {
          var box = action === 'schedule' ? schedErr : err;
          err.textContent = ''; schedErr.textContent = '';
          if (opts && opts.note && !note.value.trim()) { box.textContent = opts.note; return; }
          var when = '', visitor = null;
          if (action === 'schedule') {
            var check = sched.value();
            if (check.error) { box.textContent = check.error; return; }
            visitor = visit.value();
            if (visitor.error) { box.textContent = visitor.error; return; }
            when = check.text;
          }
          busy(ev.target, true);
          call('landlordAction', [ID, TOKEN, action, note.value, when, visitor]).then(renderRequest)
            .catch(function (e) { box.textContent = e; busy(ev.target, false); });
        };
      }
      app.appendChild(el('div', { class: 'card' }, [
        el('h3', { style: 'margin-top:0;font-size:16px', text: 'Respond' }),
        el('label', { text: 'Message' }), note,
        el('div', { class: 'actions' }, [
          r.status === 'Submitted' ? el('button', { onclick: act('acknowledge'), text: 'Acknowledge' }) : null,
          el('button', { class: 'secondary', onclick: act('update', { note: 'Please enter an update.' }), text: 'Post update' }),
          el('button', { class: 'secondary', onclick: act('complete'), text: 'Mark complete' }),
          el('button', { class: 'danger', onclick: act('decline', { note: 'Please add a few details in the message box so the tenant understands.' }), text: 'Decline' })
        ]),
        el('div', { class: 'help', text: 'If you decline, please add a few details in the message so the tenant understands.' }),
        err
      ]));
      app.appendChild(el('div', { class: 'card' }, [
        el('h3', { style: 'margin-top:0;font-size:16px', text: 'Schedule a visit' }),
        el('div', { class: 'help', style: 'margin-top:0', text: r.area === 'Exterior'
          ? 'Exterior work: no entry needed. Share the date so the tenant knows when to expect someone.'
          : 'Interior work: choose a time at least 24 hours from now. The tenant confirms it here.' }),
        sched.node,
        visit.node,
        el('div', { class: 'actions' }, [el('button', { onclick: act('schedule'), text: 'Schedule visit' })]),
        el('div', { class: 'help', text: 'Any message above is included with the scheduled time.' }),
        schedErr
      ]));
    }

    // Who will be on site. Anyone other than the landlord needs contact details;
    // for interior work (entering the home), full contact details are required.
    function visitorForm(r) {
      var interior = r.area !== 'Exterior';
      var whoOpts = ['Landlord (me)', 'Contractor', 'Someone else'];
      var who = 0;
      var company = el('input', { type: 'text', maxlength: '120', placeholder: 'Company name' });
      var name = el('input', { type: 'text', maxlength: '120', placeholder: 'Contact name' });
      var phone = el('input', { type: 'tel', maxlength: '40', placeholder: 'Phone' });
      var email = el('input', { type: 'email', maxlength: '120', placeholder: 'Email (optional)' });
      var extra = el('textarea', { maxlength: '1000', style: 'min-height:64px',
        placeholder: 'Additional details: what work will be done, vehicle, access needs, anything to expect' });
      var companyLabel = el('label', { text: 'Company' });
      var reqNote = el('div', { class: 'help' });
      var contact = el('div', { class: 'hidden' }, [companyLabel, company, el('label', { text: 'Contact person' }), name,
        el('label', { text: 'Phone' }), phone, el('label', { text: 'Email' }), email, reqNote]);
      var chips = el('div', { class: 'choices' });
      whoOpts.forEach(function (label, i) {
        var input = el('input', { type: 'radio', name: 'who', value: String(i) });
        if (i === 0) input.checked = true;
        input.addEventListener('change', function () {
          who = i;
          contact.classList.toggle('hidden', i === 0);
          var isCo = i === 1;
          companyLabel.classList.toggle('hidden', !isCo); company.classList.toggle('hidden', !isCo);
          reqNote.textContent = interior
            ? 'Required for interior work: ' + (isCo ? 'company, ' : '') + 'contact person and phone, so the tenant knows who is entering the home.'
            : 'Exterior work: contact details help the tenant know who to expect.';
        });
        chips.appendChild(el('label', { class: 'choice' }, [input, ' ' + label]));
      });
      function value() {
        var v = { who: whoOpts[who], company: '', name: '', phone: '', email: '', details: extra.value.trim() };
        if (who === 0) return v;
        v.company = who === 1 ? company.value.trim() : '';
        v.name = name.value.trim(); v.phone = phone.value.trim(); v.email = email.value.trim();
        if (interior) {
          var missing = [];
          if (who === 1 && !v.company) missing.push('company');
          if (!v.name) missing.push('contact person');
          if (!v.phone) missing.push('phone');
          if (missing.length) return { error: 'For work inside the home, please add the ' + missing.join(', ') + '.' };
        } else if (!v.name && !v.company && !v.phone) {
          return { error: 'Please add at least a name or company and phone, so the tenant knows who to expect.' };
        }
        return v;
      }
      return {
        node: el('div', {}, [el('label', { text: 'Who will be on site?' }), chips, contact,
          el('label', { text: 'Additional details (optional)' }), extra]),
        value: value
      };
    }

    // Date picker plus time window. Shows the full day and date, e.g. "Saturday, November 21, 2026".
    var WINDOWS = [
      { label: 'Morning', start: '08:00', end: '12:00' },
      { label: 'Afternoon', start: '12:00', end: '16:00' },
      { label: 'Evening', start: '16:00', end: '19:00' },
      { label: 'Specific time', start: '', end: '' }
    ];
    function scheduler(r) {
      var today = new Date();
      var iso = function (d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
      var date = el('input', { type: 'date', min: iso(today), 'aria-label': 'Visit date' });
      var startT = el('input', { type: 'time', value: '09:00', 'aria-label': 'Start time' });
      var endT = el('input', { type: 'time', value: '11:00', 'aria-label': 'End time' });
      var custom = el('div', { class: 'time-row hidden' }, [el('span', { text: 'From' }), startT, el('span', { text: 'to' }), endT]);
      var preview = el('div', { class: 'notice', style: 'margin-top:12px' });
      var chosen = 0;
      var chips = el('div', { class: 'choices' });
      WINDOWS.forEach(function (w, i) {
        var input = el('input', { type: 'radio', name: 'window', value: String(i) });
        if (i === 0) input.checked = true;
        input.addEventListener('change', function () { chosen = i; custom.classList.toggle('hidden', i !== 3); update(); });
        var hint = w.start ? ' (' + fmtTime(w.start) + ' to ' + fmtTime(w.end) + ')' : '';
        chips.appendChild(el('label', { class: 'choice' }, [input, ' ' + w.label + hint]));
      });
      [date, startT, endT].forEach(function (x) { x.addEventListener('input', update); });

      function fmtTime(hm) {
        var p = hm.split(':'), h = +p[0], m = p[1];
        return ((h % 12) || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
      }
      function times() {
        var w = WINDOWS[chosen];
        return chosen === 3 ? { start: startT.value, end: endT.value } : { start: w.start, end: w.end };
      }
      function value() {
        if (!date.value) return { error: 'Please choose a date.' };
        var t = times();
        if (!t.start || !t.end) return { error: 'Please choose a start and end time.' };
        if (t.end <= t.start) return { error: 'The end time must be after the start time.' };
        var p = date.value.split('-');
        var day = new Date(+p[0], +p[1] - 1, +p[2]);
        var startAt = new Date(+p[0], +p[1] - 1, +p[2], +t.start.split(':')[0], +t.start.split(':')[1]);
        if (startAt < new Date()) return { error: 'Please choose a time that has not already passed.' };
        if (r.area !== 'Exterior' && startAt - new Date() < 24 * 3600 * 1000) {
          return { error: 'Interior visits need at least 24 hours\' notice. Please choose a later date or time.' };
        }
        var dayText = day.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        var label = chosen === 3 ? '' : WINDOWS[chosen].label + ', ';
        return { text: dayText + ', ' + label + fmtTime(t.start) + ' to ' + fmtTime(t.end) };
      }
      function update() {
        var v = value();
        preview.textContent = v.error ? (date.value ? v.error : 'Choose a date to see the full appointment.') : 'Will be sent as: ' + v.text;
      }
      update();
      return {
        node: el('div', {}, [el('label', { text: 'Date' }), date, el('label', { text: 'Time window' }), chips, custom, preview]),
        value: value
      };
    }

    if (MODE === 'list') loadList(); else loadRequest();
  </script>
</body>
</html>
