<!-- Work Request Tracker v1.7.1 -->
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --ink: #1f2933; --muted: #616e7c; --line: #e1e5e2;
    --accent: #2f5d62; --accent-ink: #ffffff; --danger: #a33a3a; --warn: #8a5a00; --ok: #2e6b3f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background: var(--accent); color: var(--accent-ink); padding: 18px 16px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: #e7ecea; color: var(--ink); white-space: nowrap; }
  .badge.Submitted { background: #fdf1d8; color: var(--warn); }
  .badge.Acknowledged, .badge.Scheduled, .badge.Inprogress { background: #e3eef7; color: #24527a; }
  .badge.Completed { background: #e2f1e6; color: var(--ok); }
  .badge.Declined { background: #f6e3e3; color: var(--danger); }
  .badge.Withdrawn { background: #eceff1; color: var(--muted); }
  button, .btn { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
    padding: 9px 16px; border-radius: 8px; cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  input[type=text], input[type=tel], input[type=email], select, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid #cbd2d9;
    border-radius: 8px; background: #fff; color: var(--ink); }
  textarea { min-height: 96px; resize: vertical; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin: 0;
    padding: 8px 12px; border: 1px solid #cbd2d9; border-radius: 8px; background: #fff; cursor: pointer; }
  .choice.block { display: flex; margin: 6px 0; }
  .choice:has(input:checked) { border-color: var(--accent); background: #eef4f3; }
  select { appearance: auto; -webkit-appearance: menulist; cursor: pointer; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .thumb { position: relative; width: 88px; height: 88px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-remove { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; padding: 0; border-radius: 50%;
    border: none; background: rgba(31,41,51,.75); color: #fff; font-size: 16px; line-height: 24px; text-align: center; }
  input[type=date], input[type=time] { font: inherit; padding: 9px 10px; border: 1px solid #cbd2d9; border-radius: 8px;
    background: #fff; color: var(--ink); }
  input[type=date] { width: 100%; }
  .time-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: center; }
  .stat.alert { border-color: #e7c97a; background: #fdf8ec; }
  .stat-n { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .stat-l { font-size: 12px; color: var(--muted); }
  .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; }
  .card.attention { border-color: #e7c97a; background: #fffbf1; }
  .visit { display: flex; gap: 14px; align-items: flex-start; }
  .datebox { flex: 0 0 58px; text-align: center; border-radius: 8px; background: #eef4f3; padding: 6px 0; }
  .db-dow, .db-mon { font-size: 12px; color: var(--accent); font-weight: 600; text-transform: uppercase; }
  .db-day { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .visit-body { flex: 1; }
  .when { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .badge.Changerequested { background: #fdf1d8; color: var(--warn); }
  .help { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .list-item { cursor: pointer; }
  .list-item:hover { border-color: var(--accent); }
  .field { margin: 8px 0; }
  .field b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase;
    letter-spacing: .03em; }
  .pre { white-space: pre-wrap; }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { border-left: 3px solid var(--line); padding: 4px 0 10px 12px; margin-left: 4px; }
  .timeline li.Landlord { border-color: #6b9bc3; }
  .timeline li.Tenant { border-color: #8bb08f; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { padding: 6px 14px; }
  .notice { background: #eef4f3; border: 1px solid #cfe0dd; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .error { color: var(--danger); font-size: 14px; margin-top: 8px; }
  .hidden { display: none !important; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-title { font-weight: 600; }
  .cal-nav { padding: 4px 12px; font-size: 18px; line-height: 1; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-dow { font-size: 11px; color: var(--muted); font-weight: 600; padding: 2px 0; }
  .cal-day { position: relative; background: transparent; color: var(--ink, #1f2933); border: 1px solid transparent; border-radius: 8px;
    padding: 8px 0; font-size: 14px; font-weight: 400; min-width: 0; }
  .cal-day:hover { border-color: var(--line); }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.has-visit { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-dot { position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #fff; }
  .cal-visit { display: block; padding: 6px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
  .cal-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn-link { display: inline-block; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 14px;
    text-decoration: none; color: var(--accent); background: #fff; }
  .btn-link:hover { border-color: var(--accent); }
  .backlink { display: inline-block; margin-bottom: 12px; text-decoration: none; color: var(--accent); font-weight: 600; }
  a { color: var(--accent); }
  @media (max-width: 480px) { main { padding: 12px; } .card { padding: 14px; } }
</style>
